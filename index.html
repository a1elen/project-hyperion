<!DOCTYPE html>
<title>project-hyperion</title>

<meta http-equiv='cache-control' content='no-cache'> 
<meta http-equiv='expires' content='0'> 
<meta http-equiv='pragma' content='no-cache'>

<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: contain;
    }

    body {
        background-color: rgb(43, 43, 43);
    }

    canvas {
        display: block;
        outline: none;
    }
</style>

<canvas onmousemove="mouseCoords(event)" onmouseenter="mouseEnter(event)" onmouseout="mouseLeave(event)"></canvas>
<script src = "js/sprites.js"></script>
<script src = "js/game.js"></script>
<script src = "js/map.js"></script>
<script src = "js/tile.js"></script>
<script src = "js/monster.js"></script>
<script src = "js/util.js"></script>
<script src = "js/items.js"></script>
<script src = "js/objects.js"></script>
<script src = "js/ablities.js"></script>
<script src = "js/traps.js"></script>
<script src = "js/biomes.js"></script>
<script src = "js/spell.js"></script>
<script src = "js/status.js"></script>
<script src = "js/controls.js"></script>
<script src = "js/touch.js"></script>
<script>
    tileSize = 64;
    levelWidth = 24;
    levelHeight = 24;
    uiWidth = 4;
    level = 1;
    maxHp = 999;
    levelPool = [];

    spritesheet = new Image();
    spritesheet.src = 'spritesheet.png';
    spritesheet.onload = showTitle;

    gameState = "loading";

    playerClass = 0;
    startingHp = 10;
    numLevels = 15;

    shakeAmount = 0;
    shakeX = 0;
    shakeY = 0;

    initTouchControls();
    initKeyControls();

    setInterval(draw, 15);

    setupCanvas();

    initSounds();
</script>
