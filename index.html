    canvas {
        outline: 1px solid white
    }

    body {
        background-color: rgb(43, 43, 43);
        text-align: center;
        margin-top: 50px;
        overscroll-behavior: contain;

<canvas onmousemove="mouseCoords(event)" onmouseenter="mouseEnter(event)" onmouseout="mouseLeave(event)"></canvas>

    spritesheet.src = 'spritesheet.png';

    gameState = "loading";

    initKeyControls();

    setInterval(draw, 15);

    setupCanvas();

    initSounds();
